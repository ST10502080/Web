    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<body>
    <header>
        <h1>Heritage Beadwork</h1>
        <img src="img/log.jpeg" class="header-logo" alt="Badidise Beadwork logo">
        <nav class="nav-links" aria-label="Main navigation">
            <a href="index.html">🏠 Homepage</a>

    <div class="page-intro">
        <h1>Enquiry</h1>
        <p>Tell us what you're looking for and we'll be in touch.</p>
    </div>

    <form id="enquiry-form" novalidate>
        <label for="name">Name</label>
        <input type="text" id="name" name="name" required placeholder="Your Name">

        <label for="surname">Surname</label>
        <input type="text" id="surname" name="surname" required placeholder="Your Surname">

        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" required placeholder="name@example.com">

        <label for="phonenumber">Phone Number</label>
        <input type="tel" id="phonenumber" name="phonenumber" required placeholder="Phone number">

        <button type="submit">Send Enquiry</button>
    </form>
